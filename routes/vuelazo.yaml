# Vuelazo deal-pipeline config (numeric defaults are config; semantics are
# fixed by docs/DECISIONS.md D2 and are NOT edited here).

origins: [MAD, BCN, VLC, ALC]   # D0: all four instrumented from day one
currency: EUR

# Discovery sweep: months ahead of today to query per origin.
#
# MUST stay well past 60 days. Measured 2026-08-08 on the live cache: at
# +1/+2 months the price-sorted top-100 from EVERY Spanish origin is 100%
# intra-EU (price ceilings 59-160 EUR) — long-haul does not exist in that
# window. At +3 months the SAME call returns MAD->NYC 372, VLC->NYC 496,
# VLC->BKK 534, ALC->MIA 671. A 2-month horizon made the product
# structurally blind to the fares it exists to find.
sweep_months_ahead: 6

# Each (origin, month) is swept twice, both free:
#   price — the cheapest 100 (the intra-EU firehose)
#   route — breadth across destinations (BCN: 0 -> 47 long-haul rows)
sweep_sortings: [price, route]
sweep_limit_price: 100
sweep_limit_route: 1000

# Google Travel Explore — origin->anywhere discovery on GOOGLE's data
# (D1 amendment 2026-08-09). The cached sweep stays: it is free and
# covers intra-EU breadth well. Explore covers what the cache is bad at
# — long-haul, with real airport codes and real date pairs, from the
# same corpus we verify against.
#
# Measured, MAD + North America + November, one call: EWR 398, YYZ 429,
# ORD 448, IAD 467, LAX 478, SFO 487. The same call WITHOUT an area
# returns Google's default list: Europe-heavy, nothing above 325 — so
# `areas` is what makes this a long-haul rail and Europe is excluded
# from it on purpose.
explore:
  enabled: true
  # serpapi (free 250/mo, today) | searchapi (Developer 10k, on flip).
  # Same engine and parameter names on both, so this is the only line
  # that changes when Carlos buys SearchAPI.
  provider: serpapi
  # Full grid = origins x areas x months = 120 windows. calls_per_day
  # walks it in a deterministic rotation so nothing starves.
  # 4/day = ~120/mo, leaving ~130 of the free 250 for verification.
  calls_per_day: 4
  areas: [north_america, south_america, asia, africa, oceania]

# Watchlist: per-route cached refresh, once a day. Long-haul is the
# product's reason to exist, so it gets the deeper date coverage.
watchlist:
  long:
    [NYC, MIA, CUN, MEX, HAV, PUJ, BOG, EZE, SCL, LIM, BKK, TYO, DEL,
     JFK, LAX, YYZ, GRU, PTY, SJO, HKT, SGN, HAN, SIN, KUL, PEK, ICN,
     JNB, CPT, MRU, DXB]
  medium:
    [TLV, CAI, AMM, RUH, JED, DOH, AUH, NBO, DKR, ACC, LOS, ADD, MRU]
  intra_eu:
    [LON, PAR, ROM, MIL, AMS, BER, BRU, VIE, PRG, BUD, ATH, LIS, OPO,
     DUB, EDI, CPH, ARN, ZRH, IST, RAK, CMN, TUN]
# Months of date coverage per watchlist route (long-haul gets more).
watchlist_months:
  long: 4
  medium: 2
  intra_eu: 1

detector:
  # D2 day-one gate: absolute route-class floors + same-day cross-section.
  floors:                 # absolute savings floor (EUR) per route class
    intra_eu: 30
    medium: 80
    long: 150
  crosssection_pct: 25    # candidate must sit >=25% below its class median today
  # Per-route percentile gate (D2 mature state) activates automatically
  # per route once this many VERIFIED observations exist inside the
  # trailing window — mirroring the min_observations pattern.
  min_observations: 8
  baseline_window_days: 60
  # Mistake-class crude catch, cold-start form: classified at VERIFY time,
  # when Google's route-specific typical range is available — live price
  # below this % of the typical LOW => mistake. (D2's trailing-P25 form
  # activates with per-route baselines in M1.)
  mistake_pct_of_typical: 50
  # ROUTE-SPECIFIC floor, measured against Google's own typical range on
  # the verification we already pay for: require
  # (typical_low - live_price) >= class floor.
  #
  # A class cross-section median is a weak comparator — it made a EUR 37
  # Turin hop look like a EUR 275 saving, and it valued BCN->KUT 120 EUR
  # (a normal Wizz winter fare, typical low 130) as a EUR 278 saving
  # against a Gulf-heavy median. This gate compares a route to ITSELF,
  # which is the honest form of "el precio normal, demostrado".
  #
  # ENFORCED since 2026-08-09 (Carlos's call, after the KUT alert).
  # Rule when Google returns NO typical range for a route (~1/3 of
  # them): the floor is unknowable, the deal may still publish, and
  # verification_refs.insights_floor records passed=null — so the size
  # of that loophole stays measurable.
  insights_floor: false
  # THE comparator (2026-08-13). Every verification already returns 61
  # daily prices for the searched itinerary; this measures the live
  # price against THAT, not against unrelated routes.
  #
  # It replaces insights_floor, which was unreachable: on every
  # long-haul route sampled, (typical_low - floor) demanded a price
  # below the trip's own 60-day MINIMUM. MAD->JFK needed <=200 when the
  # 60-day low was 326; BCN->JFK needed <=210 when the low was 269.
  # That is why nothing ever passed.
  #
  # A deal is a RECORD (below anything the trip has cost in the window)
  # or a bottom-decile price ALSO this far below the route's own median.
  # Percentages, not euros: medians here span 90 EUR to 900 EUR.
  history_gate: true
  history_min_pct_below_median:
    intra_eu: 25
    medium: 25
    long: 20

guardrails:               # non-negotiable #3 — day one
  daily_candidate_cap: 15
  route_cooldown_days: 7
  cooldown_break_pct: 10  # a further -10% re-opens a cooled-down route
  dedup_band_pct: 5       # same route within +/-5% of last deal price = dup
  # When verification proves a cached price was fiction (live above
  # cached + tolerance), don't re-nominate that EXACT itinerary for this
  # long. Measured 2026-08-10..12: 19 of 30 verifications died this way
  # and six routes were re-nominated up to 6x, each burning a daily-cap
  # slot and a paid verification to reach a conclusion we already had.
  # 24h re-checks daily (the market can move) while killing the loop.
  disproved_cooldown_hours: 24

verification:
  max_candidates_per_run: 5   # per run; the daily cap (15) still rules the day
  live_tolerance_pct: 10      # live price may exceed cached by <=10% and still verify

scoring:                  # deliberately crude (D2); Carlos's tap is the last mile
  aspiration_weights:
    intra_eu: 1.0
    medium: 1.3
    long: 1.6

drafting:
  model: claude-opus-5
  max_tokens: 1200

publish:
  # Where approved deals go. Telegram is postponed: `ntfy` uses the same
  # phone-push rail the NBO tracker already uses (NTFY_TOPIC), so the
  # chain is provable end-to-end with no bot, no channels, no members.
  # Add tg_private (and drop ntfy) when the Telegram side is ready.
  channels: [ntfy, email]
  alert_email_to: pintodiazc@gmail.com
  email_from: "Vuelazo <onboarding@resend.dev>"   # Resend test sender until vuelazo.es DNS is live
