# Destination IATA -> route class, seen from Spanish origins (D2 floors).
# intra_eu ~ short-haul (EU/Schengen + UK + Morocco/Algeria/Tunisia),
# medium   ~ Middle East / West & North-East Africa / Caucasus / Canaries-adjacent islands,
# long     ~ Americas, Asia, southern Africa, Oceania.
# Unlisted destinations default to `medium` (the middle floor — conservative
# for short-haul noise, slightly lax for long-haul; acceptable at M0 where a
# human approves every alert).

intra_eu:
  # Spanish domestic (mainland + Baleares + Canarias) — Aviasales sweeps
  # return these from any Spanish origin
  [PMI, IBZ, MAH, AGP, SVQ, XRY, GRX, ALC, VLC, MAD, BCN, BIO, EAS, SDR,
   SCQ, LCG, VGO, OVD, LEN, VLL, ZAZ, PNA, RJL, MLN,
   TFN, TFS, LPA, ACE, FUE, SPC, TCI,
  # Metro/city codes (Aviasales uses these alongside airport codes)
   LON, PAR, ROM, MIL, STO, BUH,
  # Iberia + islands
   LIS, OPO, FAO, FNC, PDL, TER,
  # France / Benelux / British Isles
