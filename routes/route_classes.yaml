# Destination IATA -> route class, seen from Spanish origins (D2 floors).
# intra_eu ~ short-haul (EU/Schengen + UK + Morocco/Algeria/Tunisia),
# medium   ~ Middle East / West & North-East Africa / Caucasus / Canaries-adjacent islands,
# long     ~ Americas, Asia, southern Africa, Oceania.
#
# UNLISTED destinations are 'unclassified' and are EXCLUDED from the gate —
# they never form a cross-section and never become candidates. They were
# silently defaulting to `medium` before, which is exactly how BCN->TRN
# (Turin, an intra-EU hop) got benchmarked against a Tel Aviv / Sharjah
# median and out-scored a transatlantic fare. Unknown codes now surface in
# /ops as `unclassified_route` rejections so this list can be grown from
# real data instead of guesswork.
#
# `excluded` destinations are classified but deliberately never alerted
# (unsellable to the audience) — Russia/CIS dominates the Aviasales cache
# from BCN and would otherwise flood the queue.

excluded:
  # Russia / Belarus / Ukraine ONLY — no sellable routing for a Spanish
  # audience (closed airspace; cached fares are multi-stop fictions).
  # Deliberately NOT excluded: the Caucasus (EVN, TBS, GYD/BAK) and
  # Central Asia (ALA, TAS, ...) are ordinary, flyable, sellable
  # destinations and stay in `medium`.
  [MOW, SVO, DME, VKO, LED, KZN, UFA, MRV, OVB, AER, KUF, ROV, KRR, GOJ,
   SVX, KJA, IKT, CEK, ESL, IJK, KHV, OMS, PEE, REN, RTW, STW, TOF, UUD,
   UUS, VOG, VVO,
   MSQ,
   KBP, IEV, ODS, LWO]

