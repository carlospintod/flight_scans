# Vuelazo — PASSIVE COLLECTOR since 2026-11-14 (DECISIONS amendment).
#
# What runs now: once a day, `run_deals.py --collect-only` prices today's
# Google Travel Explore rotation (explore.calls_per_day windows of the
# 4 origins x 5 areas x 6 months grid) on Vuelazo's own SerpApi account
# (SERPAPI_KEY_VZ, ledger pool serpapi_vz) and stores the rows in
# fare_observations. Nothing is nominated, verified, drafted, approved
# or published. Why: a deal engine needs paid discovery volume (SearchAPI
# Developer, about $40/mo) that Carlos has not bought; until he does, the
# collector builds the price history a paid trial will start from.
#
# A run that stores ZERO rows exits non-zero, so "Notify failure" below
# pushes to the phone. watchdog.yml catches what this cannot: the
# workflow not running at all.
#
# Manual dispatch:
#   mode=collect (default)  the same passive run as the schedule
#   mode=full               the whole M1 pipeline (sweep, gate, verify,
#                           draft into the /ops queue) — for the paid trial
#   publish_only=true       fan out already-approved deals (the /ops
#                           approve button sends exactly this input)
#
# Secrets: TURSO_*, NTFY_TOPIC, SERPAPI_KEY_VZ (the collector). The full
# pipeline also uses TRAVELPAYOUTS_TOKEN(_VZ), SERPAPI_KEY (fallback),
# SEARCHAPI_KEY_VZ, ANTHROPIC_API_KEY, TELEGRAM_*, RESEND_API_KEY.

name: deals

on:
  schedule:
    # Once a day. 03:41 UTC keeps clear of scan.yml (05:23 Mon/Wed/Sat,
    # which GitHub starts 7-9 h late) and watchdog.yml (19:37). GitHub may
    # start this one hours late too; the watchdog allows 48 h.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = passive Explore collector; full = whole deal pipeline"
        default: "collect"
        required: false
      publish_only:
        description: "Only fan out already-approved deals (the /ops approve path)"
        default: "false"
        required: false

concurrency:
  group: deals
  cancel-in-progress: false

permissions:
  actions: write     # keepalive re-enables this workflow
  contents: read

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN_VZ: ${{ secrets.TRAVELPAYOUTS_TOKEN_VZ }}
          SERPAPI_KEY_VZ: ${{ secrets.SERPAPI_KEY_VZ }}
          SEARCHAPI_KEY_VZ: ${{ secrets.SEARCHAPI_KEY_VZ }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_PRIVATE_CHANNEL_ID: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL_ID }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          if [ "${{ inputs.publish_only || 'false' }}" = "true" ]; then
            python run_deals.py --publish-only \
              --trigger "${{ github.event_name }}" \
              --json-summary deal_summary.json
          elif [ "${{ inputs.mode || 'collect' }}" = "full" ]; then
            python run_deals.py --queue \
              --trigger "${{ github.event_name }}" \
              --json-summary deal_summary.json
          else
            python run_deals.py --collect-only \
              --trigger "${{ github.event_name }}" \
              --json-summary deal_summary.json
          fi

      # Membership lifecycle (M2): lapse removal, T-30/T-7 reminders,
      # refund enforcement. Idempotent (CAS + event-log dedup); unchanged
      # by the passive mode. Runs even when the deal step failed:
      # money/member enforcement must never be hostage to a fare-source
      # outage.
      - name: Member lifecycle
        if: ${{ !cancelled() && inputs.publish_only != 'true' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHANNEL_ID: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL_ID }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: python scripts/member_lifecycle.py --trigger "${{ github.event_name }}"

      - name: Job summary
        if: always()
        run: |
          echo '## Deal run' >> "$GITHUB_STEP_SUMMARY"
          if [ -f deal_summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("deal_summary.json"))
          print(f"- mode: {s.get('mode', 'full')}")
          print(f"- status: **{s.get('status', '?')}** (run {s.get('run_id')})")
          if s.get("error"):
              print(f"- ✖ {s['error']}")
          for step, info in (s.get("steps") or {}).items():
              print(f"- {step}: {info}")
          for w in s.get("warnings") or []:
              print(f"- ⚠ {w}")
          PY
          else
            echo "- no summary produced (fatal before bootstrap?)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify failure (ntfy.sh)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            DETAIL=""
            if [ -f deal_summary.json ]; then
              DETAIL=$(python -c "import json; print(json.load(open('deal_summary.json')).get('error') or '')" || true)
            fi
            curl -fsS -X POST "https://ntfy.sh/$NTFY_TOPIC" \
              -H "Title: Vuelazo: deals workflow FAILED" \
              -H "Priority: high" -H "Tags: rotating_light" \
              -d "Run ${{ github.run_id }} (${{ github.event_name }}) failed. ${DETAIL:-Check Actions.}" || true
          fi

      - name: Keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deals.yml/enable"
